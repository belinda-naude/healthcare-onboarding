<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.gate-input{width:100%;background:#0a0a0a;border:1px solid #4d4d4d;color:#fff;font-size:14px;padding:12px 14px;outline:none;font-family:inherit;margin-bottom:12px;letter-spacing:.05em}

    <div class="gate-ttl">Healthcare Onboarding<br>Guide 2026</div>
    <p class="gate-sub">This guide is for Sand Healthcare team members only. Enter the password shared in your welcome email to continue.</p>
    <input class="gate-input" type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="gate-btn" onclick="checkPw()">Continue &rarr;</button>
    <div class="gate-err" id="pw-err">Incorrect password — please try again.</div>
  </div>
</div>
<div id="site-shell"></div>
<style id="site-style"></style>
<script>
var TARGET = 1562804552;
function checkPw() {
  var val = document.getElementById('pw').value;
  var hash = 0;
  for (var i = 0; i < val.length; i++) {
    var chr = val.charCodeAt(i);
    hash = ((hash << 5) - hash) + chr;
    hash |= 0;
  }
  if (hash === TARGET) {
    unlock();
  } else {
    document.getElementById('pw-err').classList.add('show');
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
function unlock() {
  // Hide gate, show site
  document.getElementById('gate-wrap').style.display = 'none';
  document.getElementById('site-style').textContent = SITE_CSS;
  document.getElementById('site-shell').style.cssText = 'display:flex;min-height:100vh;width:100%;';
  document.getElementById('site-shell').innerHTML = SITE_HTML;
  // Run site scripts
  var s = document.createElement('script');
  s.textContent = SITE_JS;
  document.body.appendChild(s);
}
</script>

 onclick=\"go('ops');sToOpen('a-ops-w78')\">&#8627; Weeks 7\u20138</div>\n    <div class=\"sub-item\" onclick=\"go('ops');sToOpen('a-ops-cross')\">&#8627; Other roles</div>\n    <div class=\"sub-item\" onclick=\"go('ops');sToOpen('a-ops-ref')\">&#8627; Reflection</div>\n  </div>\n  <div style=\"flex:1\"></div>\n  <div style=\"padding:14px 24px;border-top:1px solid var(--oil)\"><div class=\"ft\">Internal use only</div><div class=\"ft\" style=\"margin-top:3px\">Healthcare Delivery \u00b7 2026</div></div>\n</nav>\n<main class=\"main\">\n\n<div id=\"page-howto\" class=\"page\">\n  <div class=\"topbar\"><div class=\"topbar-bc\">Sand Healthcare <span>/ How to use this guide</span></div><div class=\"topbar-tag\">All roles</div></div>\n  <div class=\"qjump\"><span class=\"qjump-lbl\">Jump to</span>\n    <button class=\"qj\" onclick=\"sTo('a-howto-structure')\">Structure</button>\n    <button class=\"qj\" onclick=\"sTo('a-howto-rules')\">Before you start</button>\n    <button class=\"qj\" onclick=\"sTo('a-howto-glossary')\">Glossary</button>\n  </div>\n  <div class=\"jhero\">\n    <div class=\"jhero-ey\">Using this guide</div>\n    <h2 class=\"jhero-h2\">A compass for your first weeks.<br>Not the whole map.</h2>\n    <p class=\"jhero-sub\">The most important thing this guide can do is help you ask better informed questions, but most of your answers will come from the people you meet, the situations you encounter, and the ground you cover. Stay open, stay curious, and bring what you learn back to the team.</p>\n  </div>\n  <div id=\"a-howto-structure\" class=\"lt-section\" style=\"padding-top:36px\">\n    <div class=\"lt-inner\">\n      <div class=\"lt-head\"><div class=\"lt-ey\">Structure</div><div class=\"lt-title\">How this guide is built</div></div>\n      <div class=\"lt-body\">\n        <div class=\"how-grid\">\n          <div class=\"how-card\"><div class=\"how-card-n\">Layer 01 //</div><div class=\"how-card-t\">Shared foundation</div><div class=\"how-card-b\">The mission, Symmetri/HOS platform, the CVL framework, and the six operating principles. Every role reads this first. If you have 30 minutes before day one, spend them here.</div></div>\n          <div class=\"how-card\"><div class=\"how-card-n\">Layer 02 //</div><div class=\"how-card-t\">Your role journey</div><div class=\"how-card-b\">An 8-week structured path for your role. Each phase has a focus, readings, people to meet, and actions. Weeks 1\u20132 are shared across all four roles. Paths diverge from week 3.</div></div>\n          <div class=\"how-card\"><div class=\"how-card-n\">Layer 03 //</div><div class=\"how-card-t\">Cross-role visibility</div><div class=\"how-card-b\">Every journey includes a section on what the other three roles own. You have access to all four role journeys \u2014 understanding your teammates' work is part of landing well as a team.</div></div>\n        </div>\n      </div>\n    </div>\n  </div>\n  <div id=\"a-howto-rules\" class=\"lt-section\" style=\"padding-top:0\">\n    <div class=\"lt-inner\">\n      <div class=\"lt-head\"><div class=\"lt-ey\">Guidance</div><div class=\"lt-title\">Before you start</div></div>\n      <div class=\"lt-body\">\n        <div class=\"how-rule\"><div class=\"how-icon\">Read first</div><div class=\"how-text\"><strong>Start with the mission and the six operating principles.</strong> They are the fastest way to understand how decisions get made on this team. Everything else builds on them.</div></div>\n        <div class=\"how-rule\"><div class=\"how-icon\">CVL</div><div class=\"how-text\"><strong>Read the CVL on the Welcome page before your role-specific content.</strong> It is the operating framework everything runs on. If you are unsure what CVL stands for, check the glossary below first.</div></div>\n        <div class=\"how-rule\"><div class=\"how-icon\">People</div><div class=\"how-text\"><strong>The people meetings are not optional networking.</strong> A good conversation in week two saves you weeks of confusion in-country. Come prepared with a specific question each time.</div></div>\n        <div class=\"how-rule\"><div class=\"how-icon\">Ask early</div><div class=\"how-text\"><strong>If something feels unclear, surface it early.</strong> The week 4 reflection session is the structured moment for this \u2014 but don't wait if something important is blocking you sooner.</div></div>\n        <div class=\"how-rule\"><div class=\"how-icon\">Contribute</div><div class=\"how-text\"><strong>As you learn, share what you discover.</strong> This guide will only get better because people like you bring back what the field teaches them. Your manager and capability lead want to hear it.</div></div>\n      </div>\n    </div>\n  </div>\n  <div id=\"a-howto-glossary\" class=\"lt-section\" style=\"padding-top:0\">\n    <div class=\"lt-inner\">\n      <div class=\"lt-head\"><div class=\"lt-ey\">Reference</div><div class=\"lt-title\">Abbreviations glossary</div></div>\n      <div class=\"lt-body\">\n        <p style=\"font-size:13.5px;color:var(--lt-sub);line-height:1.75;margin-bottom:4px\">Sand uses a lot of abbreviations. Here is what they all mean \u2014 refer back to this whenever something is unclear.</p>\n        <div class=\"glossary-grid\"><div class=\"gloss-item\"><div class=\"gloss-abbr\">CVL</div><div class=\"gloss-def\">Customer Value Lifecycle \u2014 Sand's five-stage framework: Discover \u2192 Align \u2192 Activate \u2192 Deliver \u2192 Own.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">HOS</div><div class=\"gloss-def\">Health Operating System \u2014 Sand's healthcare platform, built on Symmetri.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">HEC</div><div class=\"gloss-def\">Healthcare Enablement Center \u2014 central team that standardises country implementations.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">IC</div><div class=\"gloss-def\">Intelligence Center \u2014 the physical command center built and operated in each country.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">SM</div><div class=\"gloss-def\">Solutions Manager \u2014 Ministry relationship owner and value driver in-country.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">FDE</div><div class=\"gloss-def\">Forward Deployed Engineer \u2014 technical role accountable for deployment and platform integrity.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">CD</div><div class=\"gloss-def\">Country Director \u2014 Sand's senior representative in a country.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">OPS</div><div class=\"gloss-def\">Operations Specialist \u2014 last-mile owner, accountable for the IC and continuous operations.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">TLD</div><div class=\"gloss-def\">Thursday Late Discussion \u2014 Sand's bi-weekly company all-hands, Thursdays 5pm CAT.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">STBF</div><div class=\"gloss-def\">Susan Thompson Buffett Foundation \u2014 Sand's primary healthcare funder.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">KPI</div><div class=\"gloss-def\">Key Performance Indicator \u2014 the measurable outcome tied to each use case.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">SOW</div><div class=\"gloss-def\">Statement of Work \u2014 formal document defining scope, deliverables, and terms for an engagement.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">CDP</div><div class=\"gloss-def\">Country Delivery Plan \u2014 SM-owned document with prioritised use cases, metrics, and roadmap.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">CIR</div><div class=\"gloss-def\">Country Intelligence Report \u2014 discovery-phase document capturing stakeholder map and candidate use cases.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">MOU</div><div class=\"gloss-def\">Memorandum of Understanding \u2014 formal agreement between Sand and a Ministry governing data access.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">CHW</div><div class=\"gloss-def\">Community Health Worker \u2014 frontline health workers and key users of HOS at facility level.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">DHIS2</div><div class=\"gloss-def\">District Health Information Software 2 \u2014 the most widely used health data platform across African Ministries.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">CAT</div><div class=\"gloss-def\">Central Africa Time (UTC+2) \u2014 the timezone used across Sand's healthcare operations.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">SOP</div><div class=\"gloss-def\">Standard Operating Procedure \u2014 documented step-by-step processes, used especially by the Ops team.</div></div><div class=\"gloss-item\"><div class=\"gloss-abbr\">UPS</div><div class=\"gloss-def\">Uninterruptible Power Supply \u2014 backup power hardware installed in every Intelligence Center.</div></div></div>\n      </div>\n    </div>\n  </div>\n  <div class=\"pg-footer\"><div class=\"ft\">How to use this guide \u00b7 Internal use only</div><div class=\"ft\">2026</div></div>\n</div>\n\n<div id=\"page-home\" class=\"page active\">\n  <div class=\"topbar\"><div class=\"topbar-bc\">Sand Healthcare <span>/ Welcome &amp; mission</span></div><div class=\"topbar-tag\">Foundation \u2014 all roles</div></div>\n  <div class=\"qjump\"><span class=\"qjump-lbl\">Jump to</span>\n    <button class=\"qj\" onclick=\"sTo('a-symmetri')\">Symmetri &amp; HOS</button>\n    <button class=\"qj\" onclick=\"sTo('a-cvl')\">The CVL</button>\n    <button class=\"qj\" onclick=\"sTo('a-cvl')\">Team structure</button>\n    <button class=\"qj\" onclick=\"sTo('a-principles')\">Principles</button>\n    <button class=\"qj\" onclick=\"sTo('a-platforms')\">Platforms</button>\n    <button class=\"qj\" onclick=\"sTo('a-ceremonies')\">Ceremonies</button>\n    <button class=\"qj\" onclick=\"sTo('a-roles')\">Role journeys</button>\n  </div>\n  <div class=\"hero\">\n    <div class=\"hero-ey\">Sand Healthcare Onboarding Guide \u00b7 2026</div>\n    <h1 class=\"hero-h1\">We are at the forefront of <em>digital innovation</em> across healthcare in Africa.</h1>\n    <p class=\"hero-sub\">Sand connects rural clinics into a single coordinated care network \u2014 giving frontline health workers, Ministry leaders, and data teams the intelligence to make better decisions for millions of patients. You are joining the team that builds, deploys, and sustains that network on the ground.</p>\n  </div>\n  <div class=\"compass-banner\">\n    <div class=\"compass-banner-icon\">&#9670;</div>\n    <div class=\"compass-banner-text\"><strong>Think of this guide as a compass, not a manual.</strong> It is here to help you find your feet and navigate your first weeks with confidence. It is not the complete picture of healthcare at Sand \u2014 that picture will form as you talk to people, get in the field, and learn by doing. Be curious, stay open, and bring your insights back to the team.</div>\n  </div>\n  <div class=\"stat-row\">\n    <div class=\"stat-cell\"><div class=\"stat-val\">5<span>+</span></div><div class=\"stat-label\">Countries deployed</div></div>\n    <div class=\"stat-cell\"><div class=\"stat-val\">16</div><div class=\"stat-label\">Countries by end 2026</div></div>\n    <div class=\"stat-cell\"><div class=\"stat-val\">1<span>M+</span></div><div class=\"stat-label\">Patients reached</div></div>\n    <div class=\"stat-cell\"><div class=\"stat-val\">100<span>s</span></div><div class=\"stat-label\">Clinics digitised in Rwanda alone</div></div>\n  </div>\n  <div id=\"a-symmetri\" class=\"sym-band\">\n    <div>\n      <div class=\"sym-ey\">The platform you are deploying</div>\n      <div class=\"sym-ttl\">Symmetri \u2014 the Health Operating System (HOS)</div>\n      <p class=\"sym-body\">Symmetri is Sand's Physical AI platform. In healthcare, it operates as the <strong>Health Operating System (HOS)</strong> \u2014 integrating data across satellite connectivity, electronic medical records, supply chain, and AI-enabled decision support. It connects dispersed rural facilities into a single national intelligence layer.<br><br>Whatever your role, you are contributing to the same platform. Understanding what it does and why it matters is the foundation everything else builds on.</p>\n    </div>\n    <div class=\"sym-pills\">\n      <div class=\"sym-pill\"><div class=\"sym-pill-tag\">Sense</div><div class=\"sym-pill-text\"><strong>Capture data</strong> from rural facilities, CHWs, DHIS2, supply chain, and connected devices in real time.</div></div>\n      <div class=\"sym-pill\"><div class=\"sym-pill-tag\">Analyse</div><div class=\"sym-pill-text\"><strong>Model patterns</strong> across facilities \u2014 triage, resource gaps, disease trends, care continuity failures.</div></div>\n      <div class=\"sym-pill\"><div class=\"sym-pill-tag\">Act</div><div class=\"sym-pill-text\"><strong>Surface decisions</strong> for Ministry leaders, frontline workers, and programme directors to act on confidently.</div></div>\n    </div>\n  </div>\n  <div id=\"a-cvl\" class=\"cvl-band\">\n    <div class=\"sec-hdr\"><div class=\"sec-ttl\">The Customer Value Lifecycle (CVL)</div><div class=\"sec-ct\">Your operating framework</div></div>\n    <p class=\"cvl-intro\">The CVL is Sand's internal framework for how an engagement progresses \u2014 from first Ministry contact through to sustained, Ministry-owned impact. It runs through five stages and applies to every country, every use case, and every role. You will hear it referenced constantly \u2014 understand it before everything else.</p>\n    <div class=\"cvl-row\">\n      <div class=\"cvl-step\"><div class=\"cvl-tag\">01</div><div class=\"cvl-name\">Discover</div><div class=\"cvl-desc\">Understand the Ministry's priorities, pain points, and data landscape before committing to anything.</div></div>\n      <div class=\"cvl-step\"><div class=\"cvl-tag\">02</div><div class=\"cvl-name\">Align</div><div class=\"cvl-desc\">Define the use case, confirm data access, and secure Ministry commitment to the outcome \u2014 not just the tool.</div></div>\n      <div class=\"cvl-step\"><div class=\"cvl-tag\">03</div><div class=\"cvl-name\">Activate</div><div class=\"cvl-desc\">Stand up the Intelligence Center (IC) and connect facilities. Physical and technical foundation in place.</div></div>\n      <div class=\"cvl-step\"><div class=\"cvl-tag\">04</div><div class=\"cvl-name\">Deliver</div><div class=\"cvl-desc\">Build and deploy the use case. Adoption designed in \u2014 not assumed. One use case adopted before the next begins.</div></div>\n      <div class=\"cvl-step\"><div class=\"cvl-tag\">05</div><div class=\"cvl-name\">Own</div><div class=\"cvl-desc\">Ministry operates independently. The 90-day test: could they keep running without Sand for three months?</div></div>\n    </div>\n    <p class=\"cvl-note\">Note: The CVL is not a straight line. A new use case sends you back to Align. The Align\u2013Activate\u2013Deliver loop repeats for every use case in a country.</p>\n  </div>\n  <div id=\"a-org\" class=\"org-wrap\"><div class=\"sec-hdr\"><div class=\"sec-ttl\">The Healthcare Operating Model</div><div class=\"sec-ct\">One system, in service of our customers</div></div><div class=\"hom-chart\"><div class=\"hom-row\"><div class=\"hom-main\"><div class=\"hom-card hom-mission\"><div class=\"hom-card-name\">Our Mission &amp; Customers</div></div></div><div class=\"hom-side\"><span class=\"hom-arrow\">&#8594;</span><div class=\"hom-mandate-box\">Our Mandate</div></div></div><div class=\"hom-row\"><div class=\"hom-main\"><div class=\"hom-card hom-country\"><div class=\"hom-card-name\">Country Teams</div><div class=\"hom-card-sub\">Togo &nbsp;&#183;&nbsp; Kenya &nbsp;&#183;&nbsp; Botswana &nbsp;&#183;&nbsp; Sierra Leone &nbsp;&#183;&nbsp; Ethiopia &nbsp;&#183;&nbsp; Senegal &nbsp;&#183;&nbsp; Benin &nbsp;&#183;&nbsp; CAR &nbsp;&#183;&nbsp; Burkina Faso &nbsp;&#183;&nbsp; Rwanda &nbsp;&#183;&nbsp; Tanzania</div></div></div><div class=\"hom-side\"><span class=\"hom-arrow\">&#8594;</span><div class=\"hom-pillar\"><strong>Delivery Pillar:</strong> Own Outcome, Relationship &amp; Adoption</div></div></div><div class=\"hom-row\"><div class=\"hom-main-split\"><div class=\"hom-card hom-central\"><div class=\"hom-card-name hom-dark-name\">Central Teams</div><div class=\"hom-central-hdr\">Building Reusable Capability</div><div class=\"hom-central-items\">Delivery Ops &nbsp;&#183;&nbsp; Growth &nbsp;&#183;&nbsp; Product Engineering &nbsp;&#183;&nbsp; Product &nbsp;&#183;&nbsp; Capability Building</div></div><div class=\"hom-card hom-exco\"><div class=\"hom-card-name\">Healthcare ExCo</div><div class=\"hom-exco-tag\">Strategy &amp; Trade-offs</div><div class=\"hom-exco-items\">MD Healthcare &nbsp;&#183;&nbsp; Delivery Lead &nbsp;&#183;&nbsp; Product Director &nbsp;&#183;&nbsp; Platform Lead &nbsp;&#183;&nbsp; Country Director Rep</div></div></div><div class=\"hom-side\"><span class=\"hom-arrow\">&#8594;</span><div class=\"hom-pillar\"><strong>The Enabling Pillars:</strong> build reusable capability and make the decisions that let Country Teams succeed</div></div></div><div class=\"hom-row\"><div class=\"hom-main\"><div class=\"hom-card hom-shared\"><div class=\"hom-card-name\">Shared Services</div><div class=\"hom-card-sub\">Legal &nbsp;&#183;&nbsp; Finance &nbsp;&#183;&nbsp; IT Ops &nbsp;&#183;&nbsp; People &nbsp;&#183;&nbsp; Biz Ops &nbsp;&#183;&nbsp; Marketing</div></div></div><div class=\"hom-side\"><span class=\"hom-arrow\">&#8594;</span><div class=\"hom-pillar\"><strong>The Foundation:</strong> building the organisational foundations for scale.</div></div></div></div></div><div id=\"a-principles\" class=\"p-wrap\">\n    <div class=\"sec-hdr\"><div class=\"sec-ttl\">The six operating principles</div><div class=\"sec-ct\">Shared by all roles</div></div>\n    <p class=\"p-intro\">These principles reflect how this team approaches its work. They are a guide, not a rulebook \u2014 in the field, every situation is different and you will need to use your judgement. When something feels unclear, come back to these.</p>\n    <div class=\"p-grid\">\n      <div class=\"p-card\"><div class=\"p-num\">01 //</div><div class=\"p-ttl\">Go slow to go fast</div><div class=\"p-body\">Sustainable momentum comes from early investment in relationships, alignment, and Ministry ownership \u2014 not rushing to implementation milestones.</div></div>\n      <div class=\"p-card\"><div class=\"p-num\">02 //</div><div class=\"p-ttl\">Land as an aligned team</div><div class=\"p-body\">Every engagement starts with the CD, SM, FDE, and Ops Specialist together. The technical team builds around a local Technical Lead. You do not land alone.</div></div>\n      <div class=\"p-card\"><div class=\"p-num\">03 //</div><div class=\"p-ttl\">Earn the right to build</div><div class=\"p-body\">Stand up situational awareness before bespoke use cases. Credibility comes from simple use cases delivered cleanly \u2014 not from ambitious promises made early.</div></div>\n      <div class=\"p-card\"><div class=\"p-num\">04 //</div><div class=\"p-ttl\">Value, not activity</div><div class=\"p-body\">Success is better decisions, actions, and outcomes for the Ministry \u2014 not facilities connected, dashboards built, or tasks completed.</div></div>\n      <div class=\"p-card\"><div class=\"p-num\">05 //</div><div class=\"p-ttl\">Adoption is the deliverable</div><div class=\"p-body\">Deployment without adoption is not delivery. One use case adopted before the next begins. Adoption is designed through change management \u2014 not assumed because the tool is live.</div></div>\n      <div class=\"p-card\"><div class=\"p-num\">06 //</div><div class=\"p-ttl\">Make yourself unnecessary</div><div class=\"p-body\">Ministry ownership is the goal from day one. The test: could the Ministry keep running for 90 days if every Sand person left tomorrow?</div></div>\n    </div>\n  </div>\n  <div id=\"a-platforms\"><div class=\"platforms-section\">\n  <div class=\"sec-hdr\"><div class=\"sec-ttl\">Platforms to get set up on</div><div class=\"sec-ct\">Day one</div></div>\n  <div class=\"platforms-grid\">\n    <div class=\"platform-card\"><div class=\"platform-tag\">Communication</div><div class=\"platform-name\">Slack</div><div class=\"platform-desc\">Internal communication across Sand. Join all-staff plus the healthcare channels listed in your role journey. Most day-to-day decisions and updates happen here.</div></div>\n    <div class=\"platform-card\"><div class=\"platform-tag\">Performance</div><div class=\"platform-name\">Lattice</div><div class=\"platform-desc\">Performance activities, 1:1s, and goals tracking. Your manager will use this for check-ins and progress reviews throughout your onboarding.</div></div>\n    <div class=\"platform-card\"><div class=\"platform-tag\">HR</div><div class=\"platform-name\">Hibob</div><div class=\"platform-desc\">Core HR tool \u2014 leave, payroll, documents, and team information all live here.</div></div>\n    <div class=\"platform-card\"><div class=\"platform-tag\">Travel</div><div class=\"platform-name\">Perk</div><div class=\"platform-desc\">Corporate travel management. You will use this for every deployment \u2014 flights, accommodation, and travel approvals all go through Perk.</div></div>\n    <div class=\"platform-card\"><div class=\"platform-tag\">Delivery</div><div class=\"platform-name\">ClickUp</div><div class=\"platform-desc\">Delivery task and ticket tracking. SMs: Use Case Tracker entries live here. FDEs: sprint tracking and pattern contributions. All roles will reference it regularly.</div></div>\n    <div class=\"platform-card\"><div class=\"platform-tag\">Onboarding hub</div><div class=\"platform-name\">The Compass</div><div class=\"platform-desc\">Your central onboarding hub \u2014 continuously updated.<br><a href=\"https://sites.google.com/sandtech.com/thecompass/home\" target=\"_blank\" class=\"doc-link\">Open The Compass &#8599;</a></div></div>\n  </div>\n  <p class=\"platform-access\">Access issues? Contact <a href=\"mailto:peopleops@sandtech.com\">peopleops@sandtech.com</a></p>\n</div></div>\n  <div id=\"a-ceremonies\"><div class=\"ceremonies-section\">\n  <div class=\"sec-hdr\"><div class=\"sec-ttl\">Key ceremonies \u2014 all roles</div><div class=\"sec-ct\">Add these to your calendar early</div></div>\n  <div class=\"ceremonies-grid\">\n    <div class=\"ceremony-card\"><div class=\"ceremony-tag\">Bi-weekly \u00b7 All company</div><div class=\"ceremony-name\">TLD \u2014 Thursday Late Discussion</div><div class=\"ceremony-when\">Thursdays, 5pm CAT \u00b7 Every two weeks \u00b7 Mandatory</div><div class=\"ceremony-desc\">The company all-hands. Whole-company visibility and cross-functional connection. One of the fastest ways to build context across Sand.</div></div>\n    <div class=\"ceremony-card\"><div class=\"ceremony-tag\">Monthly · Healthcare</div><div class=\"ceremony-name\">Healthcare All Hands</div><div class=\"ceremony-when\">Last Tuesday of each month, 4–5pm CAT</div><div class=\"ceremony-desc\">The full healthcare team in one room. Strategy updates, country progress, cross-functional alignment, and team moments. Mandatory for all healthcare roles.</div></div><div class=\"ceremony-card\"><div class=\"ceremony-tag\">Company onboarding</div><div class=\"ceremony-name\">Sand Onboarding \u2014 The Great Expedition</div><div class=\"ceremony-when\">Virtual \u00b7 Next available cycle</div><div class=\"ceremony-desc\">Deep dive into Sand's mission, values, and operating principles. You will be enrolled in the next cycle \u2014 confirm the date with Belinda Naude.</div></div>\n    <div class=\"ceremony-card\"><div class=\"ceremony-tag\">Healthcare \u00b7 In person</div><div class=\"ceremony-name\">Healthcare In-Person Onboarding Week</div><div class=\"ceremony-when\">Kigali \u00b7 Next available cohort</div><div class=\"ceremony-desc\">In-person immersion with the full healthcare team. Build relationships, align on priorities, and get direct exposure to how the system works across countries. Confirm dates with Danai Mavunga.</div></div>\n    <div class=\"ceremony-card\"><div class=\"ceremony-tag\">Role-specific</div><div class=\"ceremony-name\">Your role forum</div><div class=\"ceremony-when\">See your role journey for details</div><div class=\"ceremony-desc\">Each role has its own recurring forum cadence. Details are in your role journey \u2014 make sure these are in your calendar before your first deployment.</div></div>\n  </div>\n</div></div>\n  <div id=\"a-roles\" class=\"roles-wrap\">\n    <div class=\"sec-hdr\"><div class=\"sec-ttl\">Select your role journey</div><div class=\"sec-ct\">04 roles \u00b7 8 weeks each</div></div>\n    <div class=\"roles-grid\">\n      <div class=\"r-card\" onclick=\"go('cd');openAcc('cd')\"><div class=\"r-tag\">01 // CD</div><div class=\"r-ttl\">Country Director</div><div class=\"r-desc\">Senior representative in-country. Accountable for Ministry relationships at the highest level, national strategy alignment, and overall engagement success.</div><div class=\"r-cta\">View journey</div></div>\n      <div class=\"r-card\" onclick=\"go('sm');openAcc('sm')\"><div class=\"r-tag\">02 // SM</div><div class=\"r-ttl\">Solutions Manager</div><div class=\"r-desc\">Ministry relationship owner and value driver. Accountable for whether the Ministry adopts what is built \u2014 and for continuously improving how we make that happen.</div><div class=\"r-cta\">View journey</div></div>\n      <div class=\"r-card\" onclick=\"go('fde');openAcc('fde')\"><div class=\"r-tag\">03 // FDE</div><div class=\"r-ttl\">Forward Deployed Engineer</div><div class=\"r-desc\">Technical backbone of every deployment. Accountable for the build, platform integrity, and building local Ministry technical capacity.</div><div class=\"r-cta\">View journey</div></div>\n      <div class=\"r-card\" onclick=\"go('ops');openAcc('ops')\"><div class=\"r-tag\">04 // OPS</div><div class=\"r-ttl\">Operations Specialist</div><div class=\"r-desc\">The last mile owner. Accountable for the Intelligence Center build-out and keeping in-country operations running every day.</div><div class=\"r-cta\">View journey</div></div>\n    </div>\n  </div>\n  <div class=\"pg-footer\"><div class=\"ft\">Sand Technologies \u00b7 Healthcare Delivery \u00b7 Internal use only</div><div class=\"ft\">2026</div></div>\n</div>\n\n<div id=\"page-cd\" class=\"page\">\n  <div class=\"topbar\"><div class=\"topbar-bc\">Sand Healthcare <span>/ Country Director</span></div><div class=\"topbar-tag\">01 \u00b7 8-week journey</div></div>\n  <div class=\"qjump\"><span class=\"qjump-lbl\">Jump to</span><button class=\"qj\" onclick=\"sToOpen('a-cd-w12')\">Wk 1\u20132</button><button class=\"qj\" onclick=\"sToOpen('a-cd-w34')\">Wk 3\u20134</button><button class=\"qj\" onclick=\"sToOpen('a-cd-w56')\">Wk 5\u20136</button><button class=\"qj\" onclick=\"sToOpen('a-cd-w78')\">Wk 7\u20138</button><button class=\"qj\" onclick=\"sToOpen('a-cd-cross')\">Other roles</button><button class=\"qj\" onclick=\"sToOpen('a-cd-ref')\">Reflection</button><button class=\"qj\" onclick=\"sToOpen('a-cd-resources')\">Resources</button></div>\n  <div id=\"a-cd-top\" class=\"jhero\">\n    <div class=\"jhero-ey\">01 // Country Director</div>\n    <h2 class=\"jhero-h2\">You are Sand's senior representative<br>in your country.</h2>\n    <p class=\"jhero-sub\">You engage at the highest levels of government, align Sand's solutions with national priorities, and ensure the successful adoption and sustainability of what we deploy. This role calls for someone who builds trust, navigates complexity, and positions Sand as a long-term partner to the Ministry.</p>\n  </div>\n  <div class=\"compass-note\"><div class=\"compass-icon\">&#9670;</div><div class=\"compass-text\">Your role has clear areas of ownership \u2014 but on this team, <strong>we work as a pack</strong>. Country teams often co-own outcomes together. Use this guide to understand where you are expected to lead, and bring initiative and flexibility to everything else.</div></div>\n  \n  <div class=\"slack-section\"><div class=\"slack-lbl\">Slack channels to join</div><div class=\"slack-pills\"><span class=\"slack-ch\"># all-staff</span><span class=\"slack-ch\"># healthcare-delivery</span><span class=\"slack-ch\"># hc-general</span><span class=\"slack-ch\"># hc-general-africa-expansion-team</span><span class=\"slack-ch\"># hc-country-directors</span><span class=\"slack-ch\"># your country channel</span></div></div>\n  <div class=\"role-ceremonies\"><div class=\"role-cer-inner\"><div class=\"role-cer-lbl\">Role-specific ceremonies \u2014 add these to your calendar</div><div class=\"role-cer-grid\"><div class=\"role-cer-card\"><div class=\"role-cer-name\">Country Director Forum</div><div class=\"role-cer-when\">Tuesdays, 2pm CAT \u00b7 Weekly</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare All Hands</div><div class=\"role-cer-when\">Last Tuesday of month, 4–5pm CAT</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">TLD \u2014 Thursday Late Discussion</div><div class=\"role-cer-when\">Thursdays, 5pm CAT \u00b7 Bi-weekly \u00b7 Mandatory</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">The Great Expedition</div><div class=\"role-cer-when\">Virtual \u00b7 Next available cycle</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare In-Person Onboarding</div><div class=\"role-cer-when\">Kigali \u00b7 Next available cohort</div></div></div></div></div>\n  <div class=\"weeks-wrap\"><div class=\"weeks-lbl\">8-week journey \u2014 click each phase to expand</div><div id=\"a-cd-w12\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 1\u20132</span><span class=\"wk-ttl\">Foundation \u2014 understand why we exist</span></div>\n    <span class=\"wk-tog open\">&#9662;</span>\n  </div>\n  <div class=\"wk-body open\">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Before anything role-specific, understand <strong>the mission, the platform, and the model</strong>. Fred's letter and the Room Health Operating Model are not background reading \u2014 they are the lens through which everything else makes sense.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Onboarding resources</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1BmygaGNsVZVcJiM_FXetQ-q_ACns9GpvQTi9_G8ewPE/edit\" target=\"_blank\" class=\"doc-link\">Onboarding Journey &#8599;</a> \u2014 overview of key systems, rhythms, and how Sand operates day-to-day.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://sites.google.com/sandtech.com/thecompass/home\" target=\"_blank\" class=\"doc-link\">The Compass &#8599;</a> \u2014 your central onboarding hub, continuously updated.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1udRBE355fsjZR9WSDVmPRK5tUdg48CCxLMTSDG15nco/edit\" target=\"_blank\" class=\"doc-link\">Glossary Guide &#8599;</a> \u2014 commonly used terms across Sand. Keep open throughout your first month.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1Zl35UJamLo5IeLrQwOk8imWW7QAxxp0e/view\" target=\"_blank\" class=\"doc-link\">Fred's letter to STBF &#8599;</a> \u2014 the vision, why this matters, what it takes to scale. Read this before anything else.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1J_6K096Vk2JJiFYqIUxTVG12_VcOw8yK/view\" target=\"_blank\" class=\"doc-link\">The Room Health Operating Model &#8599;</a> \u2014 the origin of the healthcare vision and how it all started.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1OzhaXjmQylUpLjp9DxbEcmwcnJbGTB6E/view\" target=\"_blank\" class=\"doc-link\">Strategic Narrative 2026 &#8599;</a> \u2014 overall direction and priorities across Sand's industries.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1iRhxlU15ncCnFqJEiKupguCO7LuflF_y/view\" target=\"_blank\" class=\"doc-link\">Positioning &#8599;</a> \u2014 how we present Sand externally to Ministries, funders, and partners.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Book now</div><div class=\"task reflect-task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><strong>Make sure your week 4 reflection session with your manager is booked in this week</strong> \u2014 calendars fill up fast!</div><div class=\"badge b-do\">Book it now</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">People to meet this week</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Danai Mavunga</div><div class=\"p-role\">Healthcare MD / Your manager</div><div class=\"p-why\">Your primary onboarding contact and manager. Any questions about the business, strategy, or where to find things \u2014 start here.</div><a class=\"p-btn\" href=\"mailto:dmavunga@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Axel Kagenza</div><div class=\"p-role\">Director, Country Enablement</div><div class=\"p-why\">Leads delivery operations. Critical context on how country teams are structured and how they interface with central.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Cedric Hirwa</div><div class=\"p-role\">Biz Ops Specialist</div><div class=\"p-why\">Owns the operating calendar. Understand OKRs, weekly reporting, and organisational cadence.</div><a class=\"p-btn\" href=\"mailto:chirwa@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Belinda Naude</div><div class=\"p-role\">People Business Partner</div><div class=\"p-why\">Your main contact for all people matters \u2014 HR, welfare, and team structure.</div><a class=\"p-btn\" href=\"mailto:bnaude@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-cd-w34\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 3\u20134</span><span class=\"wk-ttl\">The system \u2014 HOS, CVL, and the country model</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Understand <strong>how the system works end-to-end</strong>. The CVL is the spine of everything. Focus especially on Discover and Align \u2014 the stages where the CD plays the most central role.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1qBhyrg3gp-cxJSSLs0PFx3qSvw6OOOCcFwoipYzRO-c/edit\" target=\"_blank\" class=\"doc-link\">Rural Health Operating System &#8599;</a> \u2014 the model, the problem, the approach, and how it works in practice.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1wmcQyDCO0TBobj8E9TuE4po11uS-GIcv/edit\" target=\"_blank\" class=\"doc-link\">2025/26 Funder Annual Report &#8599;</a> \u2014 HOS overview, the programme's evolution, and strategic priorities.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1zdpUpIkn0PKZDZqR3vKsC5UbdAQ6a8kbsB6Yh6n1Rxo/edit\" target=\"_blank\" class=\"doc-link\">Country Deep Dives &#8599;</a> \u2014 context and learnings from countries already deployed into. Read before your first Ministry meeting.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1pXBHQFXf69oq3wmsLZ9BgAs59iPsNbtoONIQH2X5Jm4/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Team Lookbook &#8599;</a> \u2014 understand who is deployed where before any stakeholder conversations.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Deep dives to schedule</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Danai Mavunga</div><div class=\"p-role\">HOS Vision, Strategy and Narrative</div><div class=\"p-why\">The \"why\" behind HOS. What success looks like at a system level. How we position HOS to Ministries and funders.</div><a class=\"p-btn\" href=\"mailto:dmavunga@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Axel Kagenza</div><div class=\"p-role\">Country Model</div><div class=\"p-why\">How country teams are structured, how they interface with central, and what each country is working on today.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Andries van der Walt + Axel</div><div class=\"p-role\">Customer Value Lifecycle (CVL)</div><div class=\"p-why\">How we move from Ministry engagement to actual impact. The most important deep dive.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Tyler Rothman + Nomcebo</div><div class=\"p-role\">Product Deep Dive</div><div class=\"p-why\">What we are actually building. Core HOS products and where the roadmap is heading.</div><a class=\"p-btn\" href=\"mailto:trothman@sandtech.com\">Schedule deep dive</a></div></div></div>\n  </div>\n</div><div id=\"a-cd-w56\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 5\u20136</span><span class=\"wk-ttl\">Products, peers, and country intelligence</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Build peer context and <strong>deepen your understanding of the Sand product and solutions landscape</strong>. As CD, your Ministry will ask about capabilities. Answer with genuine understanding.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">CD-specific readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Operating System Directory &#8599;</a> \u2014 practical guide to navigating, deploying, and using the platform across countries and use cases.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1gNE2o9aESdFVwJvzQmRkSJhWW_imkCXt59CNpdD6lJo/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Update (March 2026) &#8599;</a> \u2014 internal reflections on progress and how we evolve to scale.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1XGc-2TpY8cVVcSW8X-vLszp7Q5TaYoLw/edit\" target=\"_blank\" class=\"doc-link\">SFH &amp; Sand in Rwanda &#8599;</a> \u2014 case study on impact in Rwanda. Know this story well.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/17UKtxUTIkLHznzSPuZyNwiDHSaIs8eGadjtqZPDsRPM/edit\" target=\"_blank\" class=\"doc-link\">Umuko: Mishungero Health Post &#8599;</a> \u2014 Umuko case study.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1eWI4h0KbDrX5w7-fIi-y6RzsZDUYPhwkdFKO6QSPI30/edit\" target=\"_blank\" class=\"doc-link\">Umuko Key Interventions &amp; Reach &#8599;</a> \u2014 interventions and reach (slides 12\u201315).</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Priority peer conversations</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Pamela Icyeza</div><div class=\"p-role\">Country Director \u2014 CAR &amp; Rwanda</div><div class=\"p-why\">Rwanda is our most advanced deployment. What has been built, how use cases were shaped, what has worked.</div><a class=\"p-btn\" href=\"mailto:picyeza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Joane Kayibanda</div><div class=\"p-role\">Country Director \u2014 Tanzania &amp; Kenya</div><div class=\"p-why\">Previously led Sierra Leone and Liberia. Fastest-moving Phase 1 countries. Insights on STBF engagement.</div><a class=\"p-btn\" href=\"mailto:jkayibanda@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Marie Christelle Igihozo</div><div class=\"p-role\">Country Director \u2014 Senegal &amp; Benin</div><div class=\"p-why\">Previously a launcher for Togo and Benin. Clearest view of what is actually happening on the ground.</div><a class=\"p-btn\" href=\"mailto:migihozo@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Lazarus Moroka</div><div class=\"p-role\">Country Director \u2014 Botswana</div><div class=\"p-why\">Joined during Phase 1. Insights on onboarding and engaging a multi-stakeholder political landscape.</div><a class=\"p-btn\" href=\"mailto:lmoroka@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Mirafe Marcos</div><div class=\"p-role\">Country Director \u2014 Ethiopia</div><div class=\"p-why\">Joined during Phase 1. Insights on engaging a digitally advanced landscape.</div><a class=\"p-btn\" href=\"mailto:mmarcos@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Andries van der Walt</div><div class=\"p-role\">AI/Solutions Director</div><div class=\"p-why\">Leads technical delivery strategy. What good deployment looks like today.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Nomcebo Ngwamba</div><div class=\"p-role\">Product Engineering Director</div><div class=\"p-why\">Deep context on how HOS is built, what exists today, and what is being developed.</div><a class=\"p-btn\" href=\"mailto:nngwamba@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Tyler Rothman</div><div class=\"p-role\">Product Director</div><div class=\"p-why\">Owns the product roadmap. Product direction, prioritisation, and where product and real-world needs differ.</div><a class=\"p-btn\" href=\"mailto:trothman@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Aidan Helmbold</div><div class=\"p-role\">SVP of Innovation</div><div class=\"p-why\">Deep historical context on healthcare at Sand, lessons from scaling, and the funder relationship.</div><a class=\"p-btn\" href=\"mailto:ahelmbold@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Monica Pun</div><div class=\"p-role\">Partnerships Manager</div><div class=\"p-why\">Leads partnerships and ecosystem development. How we work with external partners.</div><a class=\"p-btn\" href=\"mailto:mpun@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Sabina Hassan</div><div class=\"p-role\">Financial Controller</div><div class=\"p-why\">Leads financial processes. Understand how finance supports country teams.</div><a class=\"p-btn\" href=\"mailto:shassan@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Clare Manning</div><div class=\"p-role\">Deputy General Counsel</div><div class=\"p-why\">Supports legal structuring \u2014 MOUs with Ministries, contracting, and legal matters.</div><a class=\"p-btn\" href=\"mailto:cmanning@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-cd-w78\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 7\u20138</span><span class=\"wk-ttl\">Country readiness and ceremonies</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>By week 7 you should have a <strong>clear picture of your country's current state</strong>. This phase is about transitioning from learning to leading.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Key actions</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Join the <strong>Country Director Forum</strong> (Tuesdays, 2pm CAT) as an observer. Focus: value creation, quality of delivery, what is required to scale.</div><div class=\"badge b-meet\">Attend</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Join <strong>TLD</strong> (Thursdays, 5pm CAT, bi-weekly). Whole-company visibility and cross-functional connection. Mandatory.</div><div class=\"badge b-meet\">Attend</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Enrol in <strong>The Great Expedition</strong> \u2014 confirm your dates with Belinda Naude.</div><div class=\"badge b-meet\">Attend</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Attend <strong>Healthcare In-Person Onboarding Week</strong> in Kigali \u2014 confirm dates with Danai Mavunga.</div><div class=\"badge b-meet\">Attend</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><strong>Expansion Deep Dive</strong> with Danai and Axel \u2014 what worked in Phase 1 and how we are shaping Phase 2. <a href=\"https://docs.google.com/document/d/1zdpUpIkn0PKZDZqR3vKsC5UbdAQ6a8kbsB6Yh6n1Rxo/edit\" target=\"_blank\" class=\"doc-link\">Country Deep Dives &#8599;</a></div><div class=\"badge b-do\">Do</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Manager Expectations session with Belinda and Cedric \u2014 OKRs, accountability cadence, reporting, hiring.</div><div class=\"badge b-do\">Do</div></div></div>\n  </div>\n</div></div>\n  <div id=\"a-cd-cross\" class=\"cross\"><div class=\"cross-inner\">\n    <div class=\"cross-hdr\"><div class=\"cross-ttl\">How the other roles work</div>\n    <div class=\"cross-sub-txt\">You have access to all four role journeys on this site. Understanding what your teammates own is part of landing well as a team.</div></div>\n    <div class=\"cross-grid\"><div class=\"cross-card\"><div class=\"cross-tag\">02 // SM</div><div class=\"cross-name\">Solutions Manager</div><div class=\"cross-owns\">Ministry relationship + value</div><div class=\"cross-body\">Typically leads Ministry engagement day-to-day and is accountable for adoption. On some country teams roles overlap and teams move as a pack \u2014 what matters is that value is delivered.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">03 // FDE</div><div class=\"cross-name\">Forward Deployed Engineer</div><div class=\"cross-owns\">Build + platform integrity</div><div class=\"cross-body\">Leads technical deployment and shapes the product through field insights. Works closely with the SM \u2014 boundaries flex depending on team and context.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">04 // OPS</div><div class=\"cross-name\">Operations Specialist</div><div class=\"cross-owns\">The IC + continuous operations</div><div class=\"cross-body\">Owns the Intelligence Center (IC) setup, vendor relationships, and keeping in-country operations running. The physical foundation everything else depends on.</div></div></div>\n  </div></div>\n  <div id=\"a-cd-ref\" class=\"ref-full\">\n  <div class=\"ref-full-inner\">\n    <div class=\"ref-full-hdr\"><div class=\"ref-full-ttl\">Week 4 reflection session</div><div class=\"ref-full-tag\">Manager + Capability Lead</div></div>\n    <div class=\"ref-full-body\"><div><p class=\"ref-intro\">60 minutes with Danai Mavunga (your manager). All participants prepare independently first.<br><br><strong>What this is not:</strong> An assessment. It is a check on whether the onboarding is working.<br><br><strong>Danai Mavunga will book this.</strong> If it is not in the diary by end of week one \u2014 ask her to.</p></div><div class=\"ref-list\"><div class=\"ref-item\"><div class=\"ref-icon\">1</div><div class=\"ref-text\"><strong>What's landing well</strong> \u2014 what you understand clearly and feel confident in.</div></div><div class=\"ref-item\"><div class=\"ref-icon\">2</div><div class=\"ref-text\"><strong>What's still unclear</strong> \u2014 where the picture is incomplete. Surface it before it compounds.</div></div><div class=\"ref-item\"><div class=\"ref-icon\">3</div><div class=\"ref-text\"><strong>Next four weeks</strong> \u2014 concrete focus areas for weeks 5\u20138.</div></div><div class=\"ref-item\"><div class=\"ref-icon\">!</div><div class=\"ref-text\"><strong>Book in week one.</strong> Calendars fill fast.</div></div></div></div>\n  </div>\n</div>\n  <div id=\"a-cd-resources\" class=\"resources-section\">\n  <div class=\"res-ey\">Wider org visibility</div><div class=\"res-ttl\">Additional resources</div>\n  <p class=\"res-body\">Healthcare is Sand’s most advanced deployment — but the work you do in-country builds the foundation for Sand’s broader growth. These documents give you context on where Sand is headed.</p>\n  <div class=\"res-sub-hdr\">GovTech — Sand’s government and infrastructure work</div><div class=\"res-cards\"><a href=\"https://drive.google.com/file/d/1GF7qtMmfEeBjX4Yw4B-UEBT9QuvEfuF9/view?usp=sharing\" target=\"_blank\" class=\"res-card\"><div class=\"res-card-tag\">Portfolio</div><div class=\"res-card-title\">AI-Powered Government &amp; Infrastructure Solutions</div><div class=\"res-card-desc\">Project portfolio covering Government Data Hub, Agriculture Intelligence Center, Grid Intelligence Platform, Livestock Traceability, and City Intelligence Center.</div><div class=\"res-card-cta\">Open document &#8599;</div></a><a href=\"https://drive.google.com/file/d/13_xUSOJyyVj7nMSfu7aZ-QWZ9Fas9BbF/view?usp=sharing\" target=\"_blank\" class=\"res-card\"><div class=\"res-card-tag\">Strategy</div><div class=\"res-card-title\">Sand in Africa — Centralised Data and AI Platform for Public Sector</div><div class=\"res-card-desc\">How Sand is positioning its platform across African governments. Architecture, use cases, deployment model, and the national intelligence vision that healthcare sits within.</div><div class=\"res-card-cta\">Open document &#8599;</div></a><a href=\"https://drive.google.com/file/d/1vcJFMHRsv9_x3nLCe67RVzPMKtDKFgGQ/view?usp=sharing\" target=\"_blank\" class=\"res-card\"><div class=\"res-card-tag\">Concept note</div><div class=\"res-card-title\">Achieving Sovereign AI for Your Country</div><div class=\"res-card-desc\">Sand’s sovereign AI proposition — hardware, software, engineering, and capability transfer. Useful for CD conversations with Ministries about the long-term vision.</div><div class=\"res-card-cta\">Open document &#8599;</div></a></div><div class=\"res-sub-hdr\" style=\"margin-top:24px\">Sister companies — talent and education ecosystem</div><p style=\"font-size:13px;color:var(--w80);line-height:1.75;margin-bottom:14px\">Sand’s affiliated talent ecosystem trains the engineers and public sector leaders who build and run the systems we deploy.</p><div class=\"res-cards\"><a href=\"https://docs.google.com/presentation/d/1YWoxJOtvlxzsNHiaLi6BJhVF4FLvAMHtY7RvjKgJwHc/edit?usp=sharing\" target=\"_blank\" class=\"res-card\"><div class=\"res-card-tag\">Partner</div><div class=\"res-card-title\">ALX Africa</div><div class=\"res-card-desc\">Africa’s largest technology talent programme — 350,000+ graduates in software engineering, data science, and applied AI.</div><div class=\"res-card-cta\">Open document &#8599;</div></a><a href=\"https://docs.google.com/document/d/17z9QycR71jPJQXR6mEceGXJdmFZSaxNT/edit?usp=sharing&ouid=114667367673410836204&rtpof=true&sd=true\" target=\"_blank\" class=\"res-card\"><div class=\"res-card-tag\">Partner</div><div class=\"res-card-title\">African Leadership University (ALU)</div><div class=\"res-card-desc\">Reimagining higher education around mission-driven learning. Nearly 2,000 alumni. ALU Public Sector Fellowship trains executive-level leaders across ICT, infrastructure, and transportation ministries.</div><div class=\"res-card-cta\">Open document &#8599;</div></a></div>\n</div>\n  <div class=\"contribute\"><div class=\"contribute-inner\">\n  <div class=\"contribute-ey\">Your turn</div>\n  <div class=\"contribute-ttl\">What did you learn that isn't here yet?</div>\n  <p class=\"contribute-body\">This guide is a living document. As you move through your first months on the ground, you will learn things no document currently captures \u2014 about the Ministry, the platform, the country context, or how the team actually works together. We work as a team to create the best outcomes we know how, so share what you discover. Talk to your manager, add it to the team knowledge base, or flag it in your next check-in. Everyone who joins after you benefits from what you bring back.</p>\n  <div class=\"contribute-cta\">Share your insights with your manager or capability lead &#8594;</div>\n</div></div>\n  <div class=\"pg-footer\"><div class=\"ft\">Country Director \u00b7 8-week journey \u00b7 Internal use only</div><div class=\"ft\">Sand Technologies \u00b7 2026</div></div>\n</div>\n\n<div id=\"page-sm\" class=\"page\">\n  <div class=\"topbar\"><div class=\"topbar-bc\">Sand Healthcare <span>/ Solutions Manager</span></div><div class=\"topbar-tag\">02 \u00b7 8-week journey</div></div>\n  <div class=\"qjump\"><span class=\"qjump-lbl\">Jump to</span><button class=\"qj\" onclick=\"sToOpen('a-sm-w12')\">Wk 1\u20132</button><button class=\"qj\" onclick=\"sToOpen('a-sm-w34')\">Wk 3\u20134</button><button class=\"qj\" onclick=\"sToOpen('a-sm-w56')\">Wk 5\u20136</button><button class=\"qj\" onclick=\"sToOpen('a-sm-w78')\">Wk 7\u20138</button><button class=\"qj\" onclick=\"sToOpen('a-sm-cross')\">Other roles</button><button class=\"qj\" onclick=\"sToOpen('a-sm-ref')\">Reflection</button></div>\n  <div id=\"a-sm-top\" class=\"jhero\">\n    <div class=\"jhero-ey\">02 // Solutions Manager</div>\n    <h2 class=\"jhero-h2\">You own the Ministry relationship and<br>the value outcome for the engagement.</h2>\n    <p class=\"jhero-sub\">Not whether it gets built. You are the Ministry relationship driver and the CVL anchor. Customer-obsessed and deeply curious, you are accountable for whether the Ministry actually uses the platform to make better decisions \u2014 and for continuously improving how we make that happen.</p>\n  </div>\n  <div class=\"compass-note\"><div class=\"compass-icon\">&#9670;</div><div class=\"compass-text\">The CVL gives you a framework \u2014 but every country, every Ministry, and every team is different. <strong>Be the first user advocate.</strong> Go into the field, listen, bring back what you learn, and share it with the team.</div></div>\n  \n  <div class=\"slack-section\"><div class=\"slack-lbl\">Slack channels to join</div><div class=\"slack-pills\"><span class=\"slack-ch\"># all-staff</span><span class=\"slack-ch\"># healthcare-delivery</span><span class=\"slack-ch\"># hc-general</span><span class=\"slack-ch\"># hc-general-africa-expansion-team</span><span class=\"slack-ch\"># hc-solutionmanagers</span><span class=\"slack-ch\"># hc-frontier-delivery</span><span class=\"slack-ch\"># healthcare product channels</span><span class=\"slack-ch\"># your country channel</span></div></div>\n  <div class=\"role-ceremonies\"><div class=\"role-cer-inner\"><div class=\"role-cer-lbl\">Role-specific ceremonies \u2014 add these to your calendar</div><div class=\"role-cer-grid\"><div class=\"role-cer-card\"><div class=\"role-cer-name\">SM Weekly Delivery Check-in</div><div class=\"role-cer-when\">Bi-weekly Mondays, 2:00\u20132:45pm CAT</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Country Initiative Review</div><div class=\"role-cer-when\">Week 2 of each month \u00b7 60 min</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare All Hands</div><div class=\"role-cer-when\">Last Tuesday of month, 4–5pm CAT</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">TLD \u2014 Thursday Late Discussion</div><div class=\"role-cer-when\">Thursdays, 5pm CAT \u00b7 Bi-weekly \u00b7 Mandatory</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare In-Person Onboarding</div><div class=\"role-cer-when\">Kigali \u00b7 Next available cohort</div></div></div></div></div>\n  <div class=\"weeks-wrap\"><div class=\"weeks-lbl\">8-week journey \u2014 click each phase to expand</div><div id=\"a-sm-w12\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 1\u20132</span><span class=\"wk-ttl\">Foundation \u2014 mission, platform, and your role</span></div>\n    <span class=\"wk-tog open\">&#9662;</span>\n  </div>\n  <div class=\"wk-body open\">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Same foundation as every role. Start with <strong>why Sand exists in healthcare</strong> before anything role-specific.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Onboarding resources</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1BmygaGNsVZVcJiM_FXetQ-q_ACns9GpvQTi9_G8ewPE/edit\" target=\"_blank\" class=\"doc-link\">Onboarding Journey &#8599;</a> \u2014 overview of key systems, rhythms, and how Sand operates day-to-day.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://sites.google.com/sandtech.com/thecompass/home\" target=\"_blank\" class=\"doc-link\">The Compass &#8599;</a> \u2014 your central onboarding hub.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1udRBE355fsjZR9WSDVmPRK5tUdg48CCxLMTSDG15nco/edit\" target=\"_blank\" class=\"doc-link\">Glossary Guide &#8599;</a> \u2014 commonly used terms across Sand.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1Zl35UJamLo5IeLrQwOk8imWW7QAxxp0e/view\" target=\"_blank\" class=\"doc-link\">Fred's letter to STBF &#8599;</a> \u2014 the mission. Day one, before anything else.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1J_6K096Vk2JJiFYqIUxTVG12_VcOw8yK/view\" target=\"_blank\" class=\"doc-link\">The Room Health Operating Model &#8599;</a> \u2014 the origin of the healthcare vision.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a> \u2014 the primary operating document for all in-country work. Read before first deployment.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/15mUuBFOP-EJI1cwuwK5YqsGYveRv72bumuOy85aCj88/edit\" target=\"_blank\" class=\"doc-link\">In-Country Role Definitions &#8599;</a> \u2014 understand where SM accountability typically sits before you land.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1OzhaXjmQylUpLjp9DxbEcmwcnJbGTB6E/view\" target=\"_blank\" class=\"doc-link\">Strategic Narrative 2026 &#8599;</a> \u2014 overall direction and priorities for 2026.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1iRhxlU15ncCnFqJEiKupguCO7LuflF_y/view\" target=\"_blank\" class=\"doc-link\">Positioning &#8599;</a> \u2014 how we present Sand externally.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Book now</div><div class=\"task reflect-task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><strong>Make sure your week 4 reflection session with your manager is booked in this week</strong> \u2014 calendars fill up fast!</div><div class=\"badge b-do\">Book it now</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Immediate support structure</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Andries van der Walt</div><div class=\"p-role\">Capability Lead (SM/FDE)</div><div class=\"p-why\">Sets delivery standards, owns the capability framework (Tier 1\u20134 training, competencies, pattern library), and is your escalation path when something in the operating model needs support.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Your Regional Solutions Lead</div><div class=\"p-role\">Day-to-day support</div><div class=\"p-why\">Owns your practice quality, CVL fidelity, and Ministry relationship health. First call before escalating to Andries. Ask Andries to connect you.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Your Country Director</div><div class=\"p-role\">In-country line manager</div><div class=\"p-why\">Country-level accountability and primary source of Ministry context. This will vary by country \u2014 ask Danai Mavunga or your Regional Lead to make the introduction.</div><a class=\"p-btn\" href=\"mailto:dmavunga@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Belinda Naude</div><div class=\"p-role\">People Business Partner</div><div class=\"p-why\">Your main contact for people and HR matters.</div><a class=\"p-btn\" href=\"mailto:bnaude@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-sm-w34\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 3\u20134</span><span class=\"wk-ttl\">The CVL \u2014 your operating framework in depth</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>The CVL (Customer Value Lifecycle: Discover \u2192 Align \u2192 Activate \u2192 Deliver \u2192 Own) is the framework that structures everything you do. It loops back for every use case.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a> \u2014 the standard. Read this first, before any other delivery reference.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1KKGd9oeEOkGY99QVKB7rgusTYTBrvcfbuASdrRE5ids/edit\" target=\"_blank\" class=\"doc-link\">CVL Reference / Practitioner's Guide &#8599;</a> \u2014 the detailed field reference. Read alongside the Field Guide.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1qBhyrg3gp-cxJSSLs0PFx3qSvw6OOOCcFwoipYzRO-c/edit\" target=\"_blank\" class=\"doc-link\">Rural Health Operating System &#8599;</a> \u2014 the model and how it works in practice.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1wmcQyDCO0TBobj8E9TuE4po11uS-GIcv/edit\" target=\"_blank\" class=\"doc-link\">2025/26 Funder Annual Report &#8599;</a> \u2014 HOS overview and strategic priorities.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1zdpUpIkn0PKZDZqR3vKsC5UbdAQ6a8kbsB6Yh6n1Rxo/edit\" target=\"_blank\" class=\"doc-link\">Country Deep Dives &#8599;</a> \u2014 context and learnings from countries already deployed into.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1pXBHQFXf69oq3wmsLZ9BgAs59iPsNbtoONIQH2X5Jm4/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Team Lookbook &#8599;</a> \u2014 who is deployed where.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Deep dives to schedule</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Andries van der Walt + Axel</div><div class=\"p-role\">Customer Value Lifecycle (CVL)</div><div class=\"p-why\">How we move from Ministry engagement to impact. Leave with clarity on your role at each stage and what gate checks look like in practice.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Regional Solutions Lead</div><div class=\"p-role\"><a href=\"https://docs.google.com/spreadsheets/d/1KH7xNRGDRJZM8k4_w4XZ4rw1_-Kl45nRVz2-HGpMOwA/edit\" target=\"_blank\" class=\"doc-link\">Use Case Tracker &#8599;</a> Walkthrough</div><div class=\"p-why\">What a complete Use Case Tracker entry looks like and how it informs squad planning. Ask Andries to connect you.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Tyler Rothman</div><div class=\"p-role\">Product Deep Dive</div><div class=\"p-why\">The roadmap and the gap between what is sold and what is deployable today.</div><a class=\"p-btn\" href=\"mailto:trothman@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Axel Kagenza</div><div class=\"p-role\">Connected Facilities</div><div class=\"p-why\">How data enters the system, what it takes for a facility to be live, and the realistic DHIS2 to HOS picture.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Schedule deep dive</a></div></div></div>\n  </div>\n</div><div id=\"a-sm-w56\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 5\u20136</span><span class=\"wk-ttl\">Peer context and Ministry preparation</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Build context from SMs who have already deployed. <strong>Ask where things got harder than expected</strong> \u2014 not just how they work.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Operating System Directory &#8599;</a> \u2014 practical guide to navigating, deploying, and using the platform.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1gNE2o9aESdFVwJvzQmRkSJhWW_imkCXt59CNpdD6lJo/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Update (March 2026) &#8599;</a> \u2014 internal reflections on progress and scaling.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1XGc-2TpY8cVVcSW8X-vLszp7Q5TaYoLw/edit\" target=\"_blank\" class=\"doc-link\">SFH &amp; Sand in Rwanda &#8599;</a> \u2014 Rwanda case study.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/17UKtxUTIkLHznzSPuZyNwiDHSaIs8eGadjtqZPDsRPM/edit\" target=\"_blank\" class=\"doc-link\">Umuko: Mishungero Health Post &#8599;</a> \u2014 Umuko case study.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Priority peer conversations</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Experienced SM \u2014 similar context</div><div class=\"p-role\">Peer conversation</div><div class=\"p-why\">Ask your Regional Solutions Lead to connect you with an SM who has deployed in a similar country context. Ask specifically about what surprised them in-country.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Pamela Icyeza</div><div class=\"p-role\">Country Director \u2014 Rwanda</div><div class=\"p-why\">Rwanda is our most advanced deployment. Understand what full Ministry adoption looks like in practice.</div><a class=\"p-btn\" href=\"mailto:picyeza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Joane Kayibanda</div><div class=\"p-role\">Country Director \u2014 Tanzania &amp; Kenya</div><div class=\"p-why\">Fastest-moving Phase 1 countries. Lessons from rapid deployment environments.</div><a class=\"p-btn\" href=\"mailto:jkayibanda@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Apps and Enablement Lead</div><div class=\"p-role\">Central support</div><div class=\"p-why\">What central support is available and what the pattern library already contains for your context. Ask Andries to connect you.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-sm-w78\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 7\u20138</span><span class=\"wk-ttl\">Deployment readiness \u2014 confirm before you deploy</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Confirm each of these before your first in-country assignment.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Deployment checklist</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a>, <a href=\"https://docs.google.com/document/d/1KKGd9oeEOkGY99QVKB7rgusTYTBrvcfbuASdrRE5ids/edit\" target=\"_blank\" class=\"doc-link\">CVL Reference &#8599;</a>, and <a href=\"https://docs.google.com/document/d/15mUuBFOP-EJI1cwuwK5YqsGYveRv72bumuOy85aCj88/edit\" target=\"_blank\" class=\"doc-link\">In-Country Role Definitions &#8599;</a> all read and understood.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/spreadsheets/d/1KH7xNRGDRJZM8k4_w4XZ4rw1_-Kl45nRVz2-HGpMOwA/edit\" target=\"_blank\" class=\"doc-link\">Use Case Tracker &#8599;</a> access confirmed and first entry started.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Ministry stakeholder map reviewed from the <a href=\"https://docs.google.com/document/d/14SYC42gc5l5XiNz3Fx7Pz3wTjlJRK2eXav38WnW47tU/edit\" target=\"_blank\" class=\"doc-link\">Country Intelligence Report (CIR) template &#8599;</a> — each country owns and maintains their own live report separately.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Named Ministry data counterpart confirmed and data-sharing scope reviewed with Technical Lead.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Welfare standards confirmed: accommodation, transport, per diem, equipment, visa, emergency protocol.</div><div class=\"badge b-do\">Confirm</div></div></div>\n  </div>\n</div></div>\n  <div id=\"a-sm-cross\" class=\"cross\"><div class=\"cross-inner\">\n    <div class=\"cross-hdr\"><div class=\"cross-ttl\">How the other roles work</div>\n    <div class=\"cross-sub-txt\">You have access to all four role journeys on this site. Understanding what your teammates own is part of landing well as a team.</div></div>\n    <div class=\"cross-grid\"><div class=\"cross-card\"><div class=\"cross-tag\">01 // CD</div><div class=\"cross-name\">Country Director</div><div class=\"cross-owns\">The engagement end-to-end</div><div class=\"cross-body\">Most senior person in-country. Owns the overall Ministry relationship and engagement health. Your in-country line manager.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">03 // FDE</div><div class=\"cross-name\">Forward Deployed Engineer</div><div class=\"cross-owns\">Build + platform integrity</div><div class=\"cross-body\">Your closest working partner. You typically lead Ministry engagement; the FDE typically leads technical scoping \u2014 but on many teams these lines flex.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">04 // OPS</div><div class=\"cross-name\">Operations Specialist</div><div class=\"cross-owns\">The IC + continuous operations</div><div class=\"cross-body\">Owns the Intelligence Center (IC) build-out and daily operations. You handle Ministry and value-side questions; Ops handles the physical and operational layer.</div></div></div>\n  </div></div>\n  <div id=\"a-sm-ref\" class=\"ref-full\">\n  <div class=\"ref-full-inner\">\n    <div class=\"ref-full-hdr\"><div class=\"ref-full-ttl\">Week 4 reflection session</div><div class=\"ref-full-tag\">Manager + Capability Lead</div></div>\n    <div class=\"ref-full-body\"><div><p class=\"ref-intro\">60 minutes with your manager and Andries as capability lead. All participants prepare independently first.<br><br>For SMs: surface whether the CVL is clear, whether the working relationship with your FDE is set up well, and whether Ministry access looks realistic for the first deployment.</p></div><div class=\"ref-list\"><div class=\"ref-item\"><div class=\"ref-icon\">1</div><div class=\"ref-text\"><strong>CVL clarity</strong> \u2014 do you understand your role at each stage clearly enough to hold the gates?</div></div><div class=\"ref-item\"><div class=\"ref-icon\">2</div><div class=\"ref-text\"><strong>Role dynamic</strong> \u2014 does the SM/FDE working relationship feel set up for success?</div></div><div class=\"ref-item\"><div class=\"ref-icon\">!</div><div class=\"ref-text\"><strong>Weeks 5\u20138</strong> \u2014 concrete priorities toward deployment readiness.</div></div></div></div>\n  </div>\n</div>\n  \n  <div class=\"contribute\"><div class=\"contribute-inner\">\n  <div class=\"contribute-ey\">Your turn</div>\n  <div class=\"contribute-ttl\">What did you learn that isn't here yet?</div>\n  <p class=\"contribute-body\">This guide is a living document. As you move through your first months on the ground, you will learn things no document currently captures \u2014 about the Ministry, the platform, the country context, or how the team actually works together. We work as a team to create the best outcomes we know how, so share what you discover. Talk t
