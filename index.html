o your manager, add it to the team knowledge base, or flag it in your next check-in. Everyone who joins after you benefits from what you bring back.</p>\n  <div class=\"contribute-cta\">Share your insights with your manager or capability lead &#8594;</div>\n</div></div>\n  <div class=\"pg-footer\"><div class=\"ft\">Solutions Manager \u00b7 8-week journey \u00b7 Internal use only</div><div class=\"ft\">Sand Technologies \u00b7 2026</div></div>\n</div>\n\n<div id=\"page-fde\" class=\"page\">\n  <div class=\"topbar\"><div class=\"topbar-bc\">Sand Healthcare <span>/ Forward Deployed Engineer</span></div><div class=\"topbar-tag\">03 \u00b7 8-week journey</div></div>\n  <div class=\"qjump\"><span class=\"qjump-lbl\">Jump to</span><button class=\"qj\" onclick=\"sToOpen('a-fde-w12')\">Wk 1\u20132</button><button class=\"qj\" onclick=\"sToOpen('a-fde-w34')\">Wk 3\u20134</button><button class=\"qj\" onclick=\"sToOpen('a-fde-w56')\">Wk 5\u20136</button><button class=\"qj\" onclick=\"sToOpen('a-fde-w78')\">Wk 7\u20138</button><button class=\"qj\" onclick=\"sToOpen('a-fde-cross')\">Other roles</button><button class=\"qj\" onclick=\"sToOpen('a-fde-ref')\">Reflection</button></div>\n  <div id=\"a-fde-top\" class=\"jhero\">\n    <div class=\"jhero-ey\">03 // Forward Deployed Engineer</div>\n    <h2 class=\"jhero-h2\">You own the build and the<br>platform standard.</h2>\n    <p class=\"jhero-sub\">You are responsible for the end-to-end deployment, integration, and performance of Sand's technology systems in-country. This is both strategic and hands-on \u2014 requiring a strong technical foundation, excellent problem-solving, and the ability to translate system performance into real-world healthcare impact.</p>\n  </div>\n  <div class=\"compass-note\"><div class=\"compass-icon\">&#9670;</div><div class=\"compass-text\">Technical ownership is your anchor \u2014 but this is a team sport. <strong>Check the pattern library before building anything custom.</strong> Contribute what you build back to it. Every deployment makes the next one better when we share what we learn.</div></div>\n  \n  <div class=\"slack-section\"><div class=\"slack-lbl\">Slack channels to join</div><div class=\"slack-pills\"><span class=\"slack-ch\"># all-staff</span><span class=\"slack-ch\"># healthcare-delivery</span><span class=\"slack-ch\"># hc-general</span><span class=\"slack-ch\"># hc-general-africa-expansion-team</span><span class=\"slack-ch\"># hc-forward-deployed-engineers</span><span class=\"slack-ch\"># hc-frontier-delivery</span><span class=\"slack-ch\"># fde-africa-deployment-support</span><span class=\"slack-ch\"># healthcare product channels</span><span class=\"slack-ch\"># your country channel</span></div></div>\n  <div class=\"role-ceremonies\"><div class=\"role-cer-inner\"><div class=\"role-cer-lbl\">Role-specific ceremonies \u2014 add these to your calendar</div><div class=\"role-cer-grid\"><div class=\"role-cer-card\"><div class=\"role-cer-name\">FDE Forum</div><div class=\"role-cer-when\">Thursdays, 11:30am\u201312:20pm CAT \u00b7 Weekly</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Country Initiative Review</div><div class=\"role-cer-when\">Week 2 of each month \u00b7 60 min</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare All Hands</div><div class=\"role-cer-when\">Last Tuesday of month, 4–5pm CAT</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">TLD \u2014 Thursday Late Discussion</div><div class=\"role-cer-when\">Thursdays, 5pm CAT \u00b7 Bi-weekly \u00b7 Mandatory</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare In-Person Onboarding</div><div class=\"role-cer-when\">Kigali \u00b7 Next available cohort</div></div></div></div></div>\n  <div class=\"weeks-wrap\"><div class=\"weeks-lbl\">8-week journey \u2014 click each phase to expand</div><div id=\"a-fde-w12\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 1\u20132</span><span class=\"wk-ttl\">Foundation \u2014 mission, platform, and your role</span></div>\n    <span class=\"wk-tog open\">&#9662;</span>\n  </div>\n  <div class=\"wk-body open\">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Start with the mission. Then go straight to the platform. <strong>The HOS Operating System Directory is your technical foundation document.</strong> Read it before your first deployment.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Onboarding resources</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1BmygaGNsVZVcJiM_FXetQ-q_ACns9GpvQTi9_G8ewPE/edit\" target=\"_blank\" class=\"doc-link\">Onboarding Journey &#8599;</a> \u2014 overview of key systems, rhythms, and how Sand operates day-to-day.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://sites.google.com/sandtech.com/thecompass/home\" target=\"_blank\" class=\"doc-link\">The Compass &#8599;</a> \u2014 your central onboarding hub.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1udRBE355fsjZR9WSDVmPRK5tUdg48CCxLMTSDG15nco/edit\" target=\"_blank\" class=\"doc-link\">Glossary Guide &#8599;</a> \u2014 commonly used terms across Sand.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1Zl35UJamLo5IeLrQwOk8imWW7QAxxp0e/view\" target=\"_blank\" class=\"doc-link\">Fred's letter to STBF &#8599;</a> \u2014 understand the mission before you touch any code or configuration.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a> \u2014 understand every stage. You sit in the technical seat of the Align\u2013Activate\u2013Deliver loop.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Operating System Directory &#8599;</a> \u2014 practical guide to navigating, deploying, and using the platform. Read before first deployment.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/15mUuBFOP-EJI1cwuwK5YqsGYveRv72bumuOy85aCj88/edit\" target=\"_blank\" class=\"doc-link\">In-Country Role Definitions &#8599;</a> \u2014 understand how FDE and SM responsibilities typically divide before your first day in-country.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1OzhaXjmQylUpLjp9DxbEcmwcnJbGTB6E/view\" target=\"_blank\" class=\"doc-link\">Strategic Narrative 2026 &#8599;</a> \u2014 overall direction and priorities.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1J_6K096Vk2JJiFYqIUxTVG12_VcOw8yK/view\" target=\"_blank\" class=\"doc-link\">The Room Health Operating Model &#8599;</a> \u2014 the origin of the healthcare vision.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Book now</div><div class=\"task reflect-task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><strong>Make sure your week 4 reflection session with your manager is booked in this week</strong> \u2014 calendars fill up fast!</div><div class=\"badge b-do\">Book it now</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Immediate support structure</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Andries van der Walt</div><div class=\"p-role\">Capability Lead (SM/FDE)</div><div class=\"p-why\">Sets delivery and platform standards, owns the capability framework, and is your escalation path on technical and operating model questions.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Your Regional Tech Lead</div><div class=\"p-role\">First technical escalation</div><div class=\"p-why\">First call for technical blockers in-country \u2014 before Apps and Enablement. Know who this is before you land. Ask Andries to connect you.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Your Country Director</div><div class=\"p-role\">In-country line manager</div><div class=\"p-why\">Country-level accountability and primary source of Ministry context. Ask Danai or your Regional Lead to make the introduction.</div><a class=\"p-btn\" href=\"mailto:dmavunga@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Nomcebo Ngwamba</div><div class=\"p-role\">Product Engineering Director</div><div class=\"p-why\">The HOS platform as it exists today \u2014 what is live vs in development.</div><a class=\"p-btn\" href=\"mailto:nngwamba@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-fde-w34\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 3\u20134</span><span class=\"wk-ttl\">Platform, deployment standards, and data flows</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Understand <strong>what you can build on versus what needs a gap report</strong>. Check the pattern library before building anything custom.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1KKGd9oeEOkGY99QVKB7rgusTYTBrvcfbuASdrRE5ids/edit\" target=\"_blank\" class=\"doc-link\">CVL Reference / Practitioner's Guide &#8599;</a> \u2014 the detailed field reference alongside the Field Guide.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1qBhyrg3gp-cxJSSLs0PFx3qSvw6OOOCcFwoipYzRO-c/edit\" target=\"_blank\" class=\"doc-link\">Rural Health Operating System &#8599;</a> \u2014 the model and how it works in practice.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1wmcQyDCO0TBobj8E9TuE4po11uS-GIcv/edit\" target=\"_blank\" class=\"doc-link\">2025/26 Funder Annual Report &#8599;</a> \u2014 HOS overview and strategic priorities.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1zdpUpIkn0PKZDZqR3vKsC5UbdAQ6a8kbsB6Yh6n1Rxo/edit\" target=\"_blank\" class=\"doc-link\">Country Deep Dives &#8599;</a> \u2014 context and learnings from countries already deployed into.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1pXBHQFXf69oq3wmsLZ9BgAs59iPsNbtoONIQH2X5Jm4/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Team Lookbook &#8599;</a> \u2014 who is deployed where.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Deep dives to schedule</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Andries van der Walt + Axel</div><div class=\"p-role\">Customer Value Lifecycle (CVL)</div><div class=\"p-why\">Understand your role at each CVL stage and what the gate checks mean technically.</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"></div>\n  </div>\n</div><div id=\"a-fde-w56\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 5\u20136</span><span class=\"wk-ttl\">Peer context and Ministry technical engagement</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Connect with Technical Leads who have already deployed. <strong>Ask where the platform needed workarounds</strong> and what the Ministry technical counterpart relationship was like.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Operating System Directory &#8599;</a> \u2014 revisit with your deployment context in mind.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1gNE2o9aESdFVwJvzQmRkSJhWW_imkCXt59CNpdD6lJo/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Update (March 2026) &#8599;</a> \u2014 progress and learnings across the programme.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1XGc-2TpY8cVVcSW8X-vLszp7Q5TaYoLw/edit\" target=\"_blank\" class=\"doc-link\">SFH &amp; Sand in Rwanda &#8599;</a> \u2014 Rwanda case study.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1eWI4h0KbDrX5w7-fIi-y6RzsZDUYPhwkdFKO6QSPI30/edit\" target=\"_blank\" class=\"doc-link\">Umuko Key Interventions &amp; Reach &#8599;</a> \u2014 interventions and reach slides.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Priority peer conversations</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">TL / Senior FDE \u2014 similar country</div><div class=\"p-role\">Peer conversation</div><div class=\"p-why\">Ask your Regional Tech Lead to connect you. Ask specifically: what do you wish you had known before landing?</div><a class=\"p-btn\" href=\"mailto:avanderwalt@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Pamela Icyeza</div><div class=\"p-role\">Country Director \u2014 Rwanda</div><div class=\"p-why\">Rwanda is our most advanced deployment. Understand what the full technical build looks like in practice.</div><a class=\"p-btn\" href=\"mailto:picyeza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Nomcebo Ngwamba</div><div class=\"p-role\">Product Engineering Director</div><div class=\"p-why\">Platform capabilities, what is stable vs in development, and how to route product gaps correctly.</div><a class=\"p-btn\" href=\"mailto:nngwamba@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Axel Kagenza</div><div class=\"p-role\">Country Model</div><div class=\"p-why\">How country teams interface with central and what each country is currently working on technically.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-fde-w78\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 7\u20138</span><span class=\"wk-ttl\">Deployment readiness \u2014 confirm before you deploy</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Confirm every item before your first in-country assignment.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Deployment checklist</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a>, <a href=\"https://docs.google.com/document/d/1KKGd9oeEOkGY99QVKB7rgusTYTBrvcfbuASdrRE5ids/edit\" target=\"_blank\" class=\"doc-link\">CVL Reference &#8599;</a>, <a href=\"https://docs.google.com/document/d/15mUuBFOP-EJI1cwuwK5YqsGYveRv72bumuOy85aCj88/edit\" target=\"_blank\" class=\"doc-link\">In-Country Role Definitions &#8599;</a>, and <a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Directory &#8599;</a> all read.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Pattern library reviewed for your country context and planned use case.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Regional Tech Lead briefed. Data-assessment scope confirmed with SM.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Welfare standards confirmed: in-room internet, transport, per diem, equipment, visa, emergency protocol.</div><div class=\"badge b-do\">Confirm</div></div></div>\n  </div>\n</div></div>\n  <div id=\"a-fde-cross\" class=\"cross\"><div class=\"cross-inner\">\n    <div class=\"cross-hdr\"><div class=\"cross-ttl\">How the other roles work</div>\n    <div class=\"cross-sub-txt\">You have access to all four role journeys on this site. Understanding what your teammates own is part of landing well as a team.</div></div>\n    <div class=\"cross-grid\"><div class=\"cross-card\"><div class=\"cross-tag\">01 // CD</div><div class=\"cross-name\">Country Director</div><div class=\"cross-owns\">The engagement end-to-end</div><div class=\"cross-body\">Your in-country line manager. Spend and contract approvals sit here.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">02 // SM</div><div class=\"cross-name\">Solutions Manager</div><div class=\"cross-owns\">Ministry relationship + value</div><div class=\"cross-body\">Your closest working partner. You typically lead the technical side; the SM typically leads Ministry engagement \u2014 though many country teams co-own across these areas.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">04 // OPS</div><div class=\"cross-name\">Operations Specialist</div><div class=\"cross-owns\">The IC + continuous operations</div><div class=\"cross-body\">Owns the physical layer \u2014 premises, vendors, build-out, and field data reliability. You own technical configuration and the data pipeline.</div></div></div>\n  </div></div>\n  <div id=\"a-fde-ref\" class=\"ref-full\">\n  <div class=\"ref-full-inner\">\n    <div class=\"ref-full-hdr\"><div class=\"ref-full-ttl\">Week 4 reflection session</div><div class=\"ref-full-tag\">Manager + Capability Lead</div></div>\n    <div class=\"ref-full-body\"><div><p class=\"ref-intro\">60 minutes with your manager and Andries as capability lead. All participants prepare independently first.<br><br>For FDEs: surface whether the platform and pattern library are clear, whether the working relationship with your SM is set up well, and what you need to be genuinely deployment-ready.</p></div><div class=\"ref-list\"><div class=\"ref-item\"><div class=\"ref-icon\">1</div><div class=\"ref-text\"><strong>Platform clarity</strong> \u2014 is the HOS platform clear enough to build on? Where are the gaps?</div></div><div class=\"ref-item\"><div class=\"ref-icon\">2</div><div class=\"ref-text\"><strong>Role dynamic</strong> \u2014 does the working relationship with your SM feel set up for success?</div></div><div class=\"ref-item\"><div class=\"ref-icon\">!</div><div class=\"ref-text\"><strong>Weeks 5\u20138</strong> \u2014 what to focus on to be genuinely deployment-ready.</div></div></div></div>\n  </div>\n</div>\n  \n  <div class=\"contribute\"><div class=\"contribute-inner\">\n  <div class=\"contribute-ey\">Your turn</div>\n  <div class=\"contribute-ttl\">What did you learn that isn't here yet?</div>\n  <p class=\"contribute-body\">This guide is a living document. As you move through your first months on the ground, you will learn things no document currently captures \u2014 about the Ministry, the platform, the country context, or how the team actually works together. We work as a team to create the best outcomes we know how, so share what you discover. Talk to your manager, add it to the team knowledge base, or flag it in your next check-in. Everyone who joins after you benefits from what you bring back.</p>\n  <div class=\"contribute-cta\">Share your insights with your manager or capability lead &#8594;</div>\n</div></div>\n  <div class=\"pg-footer\"><div class=\"ft\">Forward Deployed Engineer \u00b7 8-week journey \u00b7 Internal use only</div><div class=\"ft\">Sand Technologies \u00b7 2026</div></div>\n</div>\n\n<div id=\"page-ops\" class=\"page\">\n  <div class=\"topbar\"><div class=\"topbar-bc\">Sand Healthcare <span>/ Operations Specialist</span></div><div class=\"topbar-tag\">04 \u00b7 8-week journey</div></div>\n  <div class=\"qjump\"><span class=\"qjump-lbl\">Jump to</span><button class=\"qj\" onclick=\"sToOpen('a-ops-w12')\">Wk 1\u20132</button><button class=\"qj\" onclick=\"sToOpen('a-ops-w34')\">Wk 3\u20134</button><button class=\"qj\" onclick=\"sToOpen('a-ops-w56')\">Wk 5\u20136</button><button class=\"qj\" onclick=\"sToOpen('a-ops-w78')\">Wk 7\u20138</button><button class=\"qj\" onclick=\"sToOpen('a-ops-cross')\">Other roles</button><button class=\"qj\" onclick=\"sToOpen('a-ops-ref')\">Reflection</button></div>\n  <div id=\"a-ops-top\" class=\"jhero\">\n    <div class=\"jhero-ey\">04 // Operations Specialist</div>\n    <h2 class=\"jhero-h2\">You own the last mile.<br>Nothing works without it.</h2>\n    <p class=\"jhero-sub\">You own the last mile \u2014 ensuring equipment, systems, and teams are ready to launch. You coordinate tech and hardware deployments to health posts and Intelligence Centers (ICs), ensure readiness across power, internet, devices, and trained users, and keep in-country operations running every day after launch.</p>\n  </div>\n  <div class=\"compass-note\"><div class=\"compass-icon\">&#9670;</div><div class=\"compass-text\">Ops is the foundation the rest of the team stands on. <strong>If something on the ground is not right, say so early.</strong> Operating conditions are a shared programme responsibility \u2014 the whole team benefits when you surface issues before they become blockers.</div></div>\n  \n  <div class=\"slack-section\"><div class=\"slack-lbl\">Slack channels to join</div><div class=\"slack-pills\"><span class=\"slack-ch\"># all-staff</span><span class=\"slack-ch\"># healthcare-delivery</span><span class=\"slack-ch\"># hc-general</span><span class=\"slack-ch\"># hc-general-africa-expansion-team</span><span class=\"slack-ch\"># hc-ops-specialists</span><span class=\"slack-ch\"># your country channel</span></div></div>\n  <div class=\"role-ceremonies\"><div class=\"role-cer-inner\"><div class=\"role-cer-lbl\">Role-specific ceremonies \u2014 add these to your calendar</div><div class=\"role-cer-grid\"><div class=\"role-cer-card\"><div class=\"role-cer-name\">Ops Forum</div><div class=\"role-cer-when\">Tuesdays, 12:00\u20131:15pm CAT \u00b7 Weekly</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare All Hands</div><div class=\"role-cer-when\">Last Tuesday of month, 4–5pm CAT</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">TLD \u2014 Thursday Late Discussion</div><div class=\"role-cer-when\">Thursdays, 5pm CAT \u00b7 Bi-weekly \u00b7 Mandatory</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">The Great Expedition</div><div class=\"role-cer-when\">Virtual \u00b7 Next available cycle</div></div><div class=\"role-cer-card\"><div class=\"role-cer-name\">Healthcare In-Person Onboarding</div><div class=\"role-cer-when\">Kigali \u00b7 Next available cohort</div></div></div></div></div>\n  <div class=\"weeks-wrap\"><div class=\"weeks-lbl\">8-week journey \u2014 click each phase to expand</div><div class=\"ops-glossary\">\n  <div class=\"ops-gloss-lbl\">Quick reference \u2014 key abbreviations used in this journey</div>\n  <div class=\"ops-gloss-grid\">\n    <div class=\"ops-gloss-item\"><strong>CVL</strong>Customer Value Lifecycle \u2014 Discover \u2192 Align \u2192 Activate \u2192 Deliver \u2192 Own</div>\n    <div class=\"ops-gloss-item\"><strong>HOS</strong>Health Operating System \u2014 the Sand healthcare platform</div>\n    <div class=\"ops-gloss-item\"><strong>IC</strong>Intelligence Center \u2014 the physical command center you build and operate</div>\n    <div class=\"ops-gloss-item\"><strong>HEC</strong>Healthcare Enablement Center \u2014 central team standardising implementations</div>\n    <div class=\"ops-gloss-item\"><strong>SOP</strong>Standard Operating Procedure \u2014 documented step-by-step processes</div>\n    <div class=\"ops-gloss-item\"><strong>UPS</strong>Uninterruptible Power Supply \u2014 backup power hardware for the IC</div>\n    <div class=\"ops-gloss-item\"><strong>DHIS2</strong>District Health Information Software 2 \u2014 primary Ministry health data platform</div>\n    <div class=\"ops-gloss-item\"><strong>STBF</strong>Susan Thompson Buffett Foundation \u2014 Sand's primary healthcare funder</div>\n    <div class=\"ops-gloss-item\"><strong>CAT</strong>Central Africa Time (UTC+2) \u2014 timezone used across Sand healthcare ops</div>\n  </div>\n</div><div id=\"a-ops-w12\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 1\u20132</span><span class=\"wk-ttl\">Foundation \u2014 mission, CVL, and your scope</span></div>\n    <span class=\"wk-tog open\">&#9662;</span>\n  </div>\n  <div class=\"wk-body open\">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Start with the mission. Then understand where Ops sits in the CVL (Customer Value Lifecycle: Discover \u2192 Align \u2192 Activate \u2192 Deliver \u2192 Own) \u2014 your work concentrates in <strong>Activate</strong>, where you build the physical foundation, and continues through Deliver and Own.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Onboarding resources</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1BmygaGNsVZVcJiM_FXetQ-q_ACns9GpvQTi9_G8ewPE/edit\" target=\"_blank\" class=\"doc-link\">Onboarding Journey &#8599;</a> \u2014 overview of key systems, rhythms, and how Sand operates day-to-day.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://sites.google.com/sandtech.com/thecompass/home\" target=\"_blank\" class=\"doc-link\">The Compass &#8599;</a> \u2014 your central onboarding hub. There are a lot of abbreviations in this role \u2014 keep the glossary in How to use this guide open.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1udRBE355fsjZR9WSDVmPRK5tUdg48CCxLMTSDG15nco/edit\" target=\"_blank\" class=\"doc-link\">Glossary Guide &#8599;</a> \u2014 commonly used terms across Sand.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Must-do readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1Zl35UJamLo5IeLrQwOk8imWW7QAxxp0e/view\" target=\"_blank\" class=\"doc-link\">Fred's letter to STBF &#8599;</a> \u2014 the mission. Day one.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a> \u2014 understand every CVL stage and where Ops plays a key role.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/15mUuBFOP-EJI1cwuwK5YqsGYveRv72bumuOy85aCj88/edit\" target=\"_blank\" class=\"doc-link\">In-Country Role Definitions &#8599;</a> \u2014 how Ops, SM, FDE, and CD responsibilities typically divide.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1ulBxtULZ8Id4yRz5RjiV14JAdrIhFzSvGesh-LKpJIE/edit\" target=\"_blank\" class=\"doc-link\">HOS Operations Rollout Playbook &#8599;</a> \u2014 how the Intelligence Center (IC) is stood up in practice. Your field manual.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1J_6K096Vk2JJiFYqIUxTVG12_VcOw8yK/view\" target=\"_blank\" class=\"doc-link\">The Room Health Operating Model &#8599;</a> \u2014 the origin of the healthcare vision.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://drive.google.com/file/d/1OzhaXjmQylUpLjp9DxbEcmwcnJbGTB6E/view\" target=\"_blank\" class=\"doc-link\">Strategic Narrative 2026 &#8599;</a> \u2014 overall direction and priorities.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"tasks\"><div class=\"tasks-lbl\">Book now</div><div class=\"task reflect-task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><strong>Make sure your week 4 reflection session with your manager is booked in this week</strong> \u2014 calendars fill up fast!</div><div class=\"badge b-do\">Book it now</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Immediate support structure</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Axel Kagenza</div><div class=\"p-role\">Director of Delivery</div><div class=\"p-why\">Your functional lead. Sets delivery standards and is your escalation path when things need support in-country.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Healthcare Enablement Center (HEC)</div><div class=\"p-role\">Standards and playbooks</div><div class=\"p-why\">Standardises country implementations, owns the current standard, and is your community of practice. Ask Axel to connect you.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Your Country Director</div><div class=\"p-role\">In-country line manager</div><div class=\"p-why\">Country-level accountability. Spend and contract approvals run through here \u2014 understand the approval chain before you need it. Ask Danai or Axel to connect you.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">Belinda Naude</div><div class=\"p-role\">People Business Partner</div><div class=\"p-why\">Your main contact for people and HR matters.</div><a class=\"p-btn\" href=\"mailto:bnaude@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-ops-w34\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 3\u20134</span><span class=\"wk-ttl\">Intelligence Center \u2014 build, handover, and procurement</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Understand the <strong>end-to-end Intelligence Center (IC) process</strong> \u2014 from premises criteria through vendor selection, build oversight, and the final acceptance certificate. Every step in the vendor SOP (Standard Operating Procedure) checklist exists because of something learned on a previous deployment.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1qBhyrg3gp-cxJSSLs0PFx3qSvw6OOOCcFwoipYzRO-c/edit\" target=\"_blank\" class=\"doc-link\">Rural Health Operating System &#8599;</a> \u2014 the model and how it works across countries.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1wmcQyDCO0TBobj8E9TuE4po11uS-GIcv/edit\" target=\"_blank\" class=\"doc-link\">2025/26 Funder Annual Report &#8599;</a> \u2014 HOS overview and strategic priorities.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1zdpUpIkn0PKZDZqR3vKsC5UbdAQ6a8kbsB6Yh6n1Rxo/edit\" target=\"_blank\" class=\"doc-link\">Country Deep Dives &#8599;</a> \u2014 context and learnings from countries already deployed into.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1pXBHQFXf69oq3wmsLZ9BgAs59iPsNbtoONIQH2X5Jm4/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Team Lookbook &#8599;</a> \u2014 who is deployed where.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Deep dives to schedule</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">HEC Lead</div><div class=\"p-role\">IC Build and Handover</div><div class=\"p-why\">Premises criteria, procurement, build oversight, final acceptance. Walk through the vendor SOP checklist line by line. Ask Axel to connect you.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Axel Kagenza + relevant FDE Lead</div><div class=\"p-role\">Connected Facilities</div><div class=\"p-why\">How data enters the HOS system and what a facility being live actually means in practice.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Schedule deep dive</a></div><div class=\"person\"><div class=\"p-name\">Nehemie / Abraham / Saibou / Eric</div><div class=\"p-role\">Procurement Deep Dive</div><div class=\"p-why\">Procurement processes and the playbook from selection through contracting. Ask Axel to connect you.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Schedule deep dive</a></div></div></div>\n  </div>\n</div><div id=\"a-ops-w56\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 5\u20136</span><span class=\"wk-ttl\">Peer context and country preparation</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Connect with an experienced Ops Specialist. <strong>Ask about vendor surprises and build-out challenges.</strong> The practical knowledge from someone who has already stood up an IC in a similar context is irreplaceable.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Readings</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Operating System Directory &#8599;</a> \u2014 practical guide to navigating the platform.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/presentation/d/1gNE2o9aESdFVwJvzQmRkSJhWW_imkCXt59CNpdD6lJo/edit\" target=\"_blank\" class=\"doc-link\">Healthcare Update (March 2026) &#8599;</a> \u2014 progress and learnings across the programme.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1XGc-2TpY8cVVcSW8X-vLszp7Q5TaYoLw/edit\" target=\"_blank\" class=\"doc-link\">SFH &amp; Sand in Rwanda &#8599;</a> \u2014 Rwanda case study.</div><div class=\"badge b-read\">Read</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/17UKtxUTIkLHznzSPuZyNwiDHSaIs8eGadjtqZPDsRPM/edit\" target=\"_blank\" class=\"doc-link\">Umuko: Mishungero Health Post &#8599;</a> \u2014 Umuko case study.</div><div class=\"badge b-read\">Read</div></div></div><div class=\"ppl\"><div class=\"ppl-lbl\">Priority peer conversations</div><div class=\"ppl-grid\"><div class=\"person\"><div class=\"p-name\">Experienced Ops Specialist</div><div class=\"p-role\">Similar country context</div><div class=\"p-why\">Ask the HEC to connect you. Ask specifically about vendor surprises, access blockers, and what the final acceptance process looked like.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div><div class=\"person\"><div class=\"p-name\">HEC Lead</div><div class=\"p-role\">Standards and support</div><div class=\"p-why\">What central support is available and how to draw on it without reinventing what another country already built. Ask Axel to connect you.</div><a class=\"p-btn\" href=\"mailto:akagenza@sandtech.com\">Introduce yourself</a></div></div></div>\n  </div>\n</div><div id=\"a-ops-w78\" class=\"wk\">\n  <div class=\"wk-hdr\" onclick=\"twOpen(this)\">\n    <div class=\"wk-hdr-l\"><span class=\"wk-tag\">Wk 7\u20138</span><span class=\"wk-ttl\">Deployment readiness \u2014 confirm before you deploy</span></div>\n    <span class=\"wk-tog \">&#9662;</span>\n  </div>\n  <div class=\"wk-body \">\n    <div class=\"wk-focus\"><div class=\"focus-lbl\">Focus</div><p>Confirm every item before your first in-country assignment.</p></div>\n    <div class=\"tasks\"><div class=\"tasks-lbl\">Deployment checklist</div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\"><a href=\"https://docs.google.com/document/d/1jDbWDARY79HgRFnOKdCof5ocBYbsPbut1aptjC-eGbI/edit\" target=\"_blank\" class=\"doc-link\">CVL Field Guide &#8599;</a>, <a href=\"https://docs.google.com/document/d/15mUuBFOP-EJI1cwuwK5YqsGYveRv72bumuOy85aCj88/edit\" target=\"_blank\" class=\"doc-link\">In-Country Role Definitions &#8599;</a>, <a href=\"https://docs.google.com/document/d/1h6UbSOc35txFjRjHD4luiJCY2CZdtZO3d40h7QUPY_c/edit\" target=\"_blank\" class=\"doc-link\">HOS Directory &#8599;</a>, and <a href=\"https://docs.google.com/document/d/1ulBxtULZ8Id4yRz5RjiV14JAdrIhFzSvGesh-LKpJIE/edit\" target=\"_blank\" class=\"doc-link\">HOS Operations Rollout Playbook &#8599;</a> all read.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Premises criteria and candidate sites reviewed for your country.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Procurement, contracting, and Final Acceptance process understood end-to-end.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Opening/closing/preventive-maintenance checklists and escalation matrix reviewed.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Power, connectivity, and UPS (Uninterruptible Power Supply) sizing reviewed for the planned site.</div><div class=\"badge b-do\">Confirm</div></div><div class=\"task\"><div class=\"cb\" onclick=\"tc(this)\"></div><div class=\"task-txt\">Welfare standards confirmed: accommodation, transport, per diem, equipment, visa, emergency protocol.</div><div class=\"badge b-do\">Confirm</div></div></div>\n  </div>\n</div></div>\n  <div id=\"a-ops-cross\" class=\"cross\"><div class=\"cross-inner\">\n    <div class=\"cross-hdr\"><div class=\"cross-ttl\">How the other roles work</div>\n    <div class=\"cross-sub-txt\">You have access to all four role journeys on this site. Understanding what your teammates own is part of landing well as a team.</div></div>\n    <div class=\"cross-grid\"><div class=\"cross-card\"><div class=\"cross-tag\">01 // CD</div><div class=\"cross-name\">Country Director</div><div class=\"cross-owns\">The engagement end-to-end</div><div class=\"cross-body\">Your in-country line manager. Spend approval and contract sign-off sit here.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">02 // SM</div><div class=\"cross-name\">Solutions Manager</div><div class=\"cross-owns\">Ministry relationship + value</div><div class=\"cross-body\">Surfaces value and adoption blockers. You handle the operational and physical layer; the SM handles the Ministry and value side. You co-deliver training and readiness together.</div></div><div class=\"cross-card\"><div class=\"cross-tag\">03 // FDE</div><div class=\"cross-name\">Forward Deployed Engineer</div><div class=\"cross-owns\">Build + technical pipeline</div><div class=\"cross-body\">Owns technical configuration and the data pipeline. You own the physical layer and field data reliability. You confirm data is captured and sent from the field; FDE handles the pipeline from there.</div></div></div>\n  </div></div>\n  <div id=\"a-ops-ref\" class=\"ref-full\">\n  <div class=\"ref-full-inner\">\n    <div class=\"ref-full-hdr\"><div class=\"ref-full-ttl\">Week 4 reflection session</div><div class=\"ref-full-tag\">Manager + Capability Lead</div></div>\n    <div class=\"ref-full-body\"><div><p class=\"ref-intro\">60 minutes with your Country Director and Axel as capability lead. All participants prepare independently first.<br><br>For Ops: surface whether the procurement and vendor management process feels clear, whether the HEC escalation path is understood, and whether welfare standards are in place for the planned deployment.</p></div><div class=\"ref-list\"><div class=\"ref-item\"><div class=\"ref-icon\">1</div><div class=\"ref-text\"><strong>Process clarity</strong> \u2014 is the IC build and procurement process clear enough to execute?</div></div><div class=\"ref-item\"><div class=\"ref-icon\">2</div><div class=\"ref-text\"><strong>Support clarity</strong> \u2014 is the HEC escalation path understood and accessible?</div></div><div class=\"ref-item\"><div class=\"ref-icon\">!</div><div class=\"ref-text\"><strong>Weeks 5\u20138</strong> \u2014 concrete focus for deployment readiness.</div></div></div></div>\n  </div>\n</div>\n  \n  <div class=\"contribute\"><div class=\"contribute-inner\">\n  <div class=\"contribute-ey\">Your turn</div>\n  <div class=\"contribute-ttl\">What did you learn that isn't here yet?</div>\n  <p class=\"contribute-body\">This guide is a living document. As you move through your first months on the ground, you will learn things no document currently captures \u2014 about the Ministry, the platform, the country context, or how the team actually works together. We work as a team to create the best outcomes we know how, so share what you discover. Talk to your manager, add it to the team knowledge base, or flag it in your next check-in. Everyone who joins after you benefits from what you bring back.</p>\n  <div class=\"contribute-cta\">Share your insights with your manager or capability lead &#8594;</div>\n</div></div>\n  <div class=\"pg-footer\"><div class=\"ft\">Operations Specialist \u00b7 8-week journey \u00b7 Internal use only</div><div class=\"ft\">Sand Technologies \u00b7 2026</div></div>\n</div>\n</main>";
